# Build a Windows .exe of the bank-statement converter (PyInstaller, onefile).
#
# Why CI instead of a local Windows machine: there is no Windows machine in
# this environment. GitHub Actions windows-latest is free for public repos,
# so the packaging path is validated on every converter change.
#
# Scope (honest): the exe covers the DIGITAL-PDF path only (pdfplumber).
# The OCR/scanned-PDF path needs a separate tesseract install and is NOT
# inside the exe. No installer, no GUI, no auto-update -- those are out of
# scope for presale v1; the exe is a console tool.
name: build-windows

on:
  push:
    branches: [main]
    paths:
      - "converter/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: converter
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Run digital-fixture validation
        run: |
          python fixtures/generate_fixtures.py
          python -m pytest test_converter.py -v

      - name: Build Windows exe
        run: pyinstaller --onefile --name bank-statement-converter --console bank_statement.py

      - name: Smoke-test the exe on fixture A
        # Fixture A ground truth: 12 transaction rows -> CSV = header + 12 lines.
        run: |
          .\dist\bank-statement-converter.exe fixtures\fixture-a-two-col-two-page.pdf smoke-a.csv
          $lines = (Get-Content smoke-a.csv).Count
          if ($lines -ne 13) { throw "smoke test: expected 13 CSV lines, got $lines" }
          Write-Host "smoke test OK: 12 rows extracted by the exe"

      - uses: actions/upload-artifact@v4
        with:
          name: bank-statement-converter-windows
          path: converter/dist/bank-statement-converter.exe
          if-no-files-found: error

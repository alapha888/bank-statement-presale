# Build Windows .exes of the bank-statement converter (PyInstaller, onefile):
# a CLI exe and a GUI exe. See converter/构建记录-GUI打包.md for the
# console-vs-windowed decision and the GUI smoke-test design.
#
# Why CI instead of a local Windows machine: there is no Windows machine in
# this environment. GitHub Actions windows-latest is free for public repos,
# so the packaging path is validated on every converter change.
#
# Scope (honest): both exes cover the DIGITAL-PDF path only (pdfplumber).
# The OCR/scanned-PDF path needs a separate tesseract install and is NOT
# inside either exe. No auto-update -- that is out of scope for presale v1.
# The installer (build-installer job below, installer/*.iss) packages the
# two exes only; it does NOT bundle tesseract and does NOT claim OCR support.
# Both exes are console builds: the GUI exe keeps --console
# so gui.py's no-display message stays visible in CI logs instead of being
# swallowed by a windowed build.
name: build-windows

on:
  push:
    branches: [main]
    paths:
      - "converter/**"
      - "installer/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: converter
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Run digital-fixture validation
        run: |
          python fixtures/generate_fixtures.py
          python fixtures/generate_edge_fixtures.py
          python -m pytest test_converter.py test_edge_cases.py -v

      - name: Build Windows exe
        run: pyinstaller --onefile --name bank-statement-converter --console bank_statement.py

      - name: Build Windows GUI exe
        # --console (not --windowed) on purpose: gui.py prints its graceful
        # no-display message ("无法打开图形界面…") to stdout, and a
        # --windowed build redirects stdout to nowhere, so the message --
        # and the smoke test that asserts it -- would be unobservable.
        # Cost, accepted for presale v1: double-clicking the GUI exe also
        # opens a console window next to the GUI window. Revisit --windowed
        # only with a log-file fallback for errors + a real-Windows
        # click-through check (see converter/构建记录-GUI打包.md).
        run: pyinstaller --onefile --name bank-statement-converter-gui --console gui.py

      - name: Smoke-test the exe on fixture A
        # Fixture A ground truth: 12 transaction rows -> CSV = header + 12 lines.
        run: |
          .\dist\bank-statement-converter.exe fixtures\fixture-a-two-col-two-page.pdf smoke-a.csv
          $lines = (Get-Content smoke-a.csv).Count
          if ($lines -ne 13) { throw "smoke test: expected 13 CSV lines, got $lines" }
          Write-Host "smoke test OK: 12 rows extracted by the exe"

      - name: Smoke-test the GUI exe (headless runner)
        # Windows tkinter uses Win32, not $DISPLAY: there is no Linux-style
        # "no display name" failure on native Windows, and windows-latest
        # provides a desktop session, so Tk() is EXPECTED to succeed and
        # mainloop() to block -- the Linux headless outcome (quick exit 1)
        # is the fallback branch here, not the expected one.
        # Exactly two outcomes pass, each strictly asserted -- this is NOT
        # "any exit code passes":
        #  (a) quick exit: exit code must be exactly 1, stdout must contain
        #      "无法打开图形界面", no "Traceback" in stdout/stderr; or
        #  (b) still running after 15 s: the window opened and mainloop is
        #      alive, no "Traceback" in captured output; the process is
        #      then killed. Any other exit code, exit 1 without the
        #      message, or any Traceback fails the step.
        run: |
          $outFile = "gui-smoke-out.txt"
          $errFile = "gui-smoke-err.txt"
          $proc = Start-Process -FilePath ".\dist\bank-statement-converter-gui.exe" -RedirectStandardOutput $outFile -RedirectStandardError $errFile -PassThru -NoNewWindow
          $exited = $proc.WaitForExit(15000)
          $out = ""
          $err = ""
          if (Test-Path $outFile) { $out = Get-Content $outFile -Raw }
          if (Test-Path $errFile) { $err = Get-Content $errFile -Raw }
          if (($out -match "Traceback") -or ($err -match "Traceback")) { throw "GUI smoke test: Traceback in GUI exe output" }
          if ($exited) {
            if ($proc.ExitCode -ne 1) { throw "GUI smoke test: expected exit code 1 (graceful no-display), got $($proc.ExitCode)" }
            if ($out -notmatch "无法打开图形界面") { throw "GUI smoke test: graceful no-display message missing from stdout" }
            Write-Host "GUI smoke OK: graceful no-display exit (code 1, message present, no Traceback)"
          } else {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Write-Host "GUI smoke OK: window opened (still running after 15 s), no Traceback; killed it"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: bank-statement-converter-windows
          path: converter/dist/bank-statement-converter.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: bank-statement-converter-gui-windows
          path: converter/dist/bank-statement-converter-gui.exe
          if-no-files-found: error

  build-installer:
    # Packages the two exes above into one Inno Setup installer.
    # NOTE: the task brief said `needs: build-windows`, but the existing
    # job id is `build-exe` (the workflow is named build-windows); the
    # dependency below uses the real job id.
    needs: build-exe
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Download CLI exe artifact
        uses: actions/download-artifact@v4
        with:
          name: bank-statement-converter-windows
          path: installer/cli

      - name: Download GUI exe artifact
        uses: actions/download-artifact@v4
        with:
          name: bank-statement-converter-gui-windows
          path: installer/gui

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        # ISCC path is Inno Setup 6's default choco install location.
        # The .iss expects the exes at installer\cli\ and installer\gui\
        # (placed there by the two download steps above) and the README at
        # converter\README.md (checked out). Output lands next to the .iss.
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\bank-statement-converter.iss
          Get-ChildItem installer\bank-statement-converter-setup-*.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: bank-statement-converter-installer-windows
          path: installer/bank-statement-converter-setup-*.exe
          if-no-files-found: error
